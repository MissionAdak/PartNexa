<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="studioShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <linearGradient id="silverCan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow3)" />
  <ellipse cx="250" cy="425" rx="110" ry="16" fill="#0F172A" opacity="0.12" filter="blur(10px)" />

  <g filter="url(#studioShadow3)" transform="translate(0, 0)">
    <!-- Bottom Nipple Outflow -->
    <rect x="242" y="370" width="16" height="55" rx="4" fill="url(#silverCan)" stroke="#64748B" stroke-width="2" />
    <ellipse cx="250" cy="420" rx="8" ry="4" fill="#334155" />
    <circle cx="250" cy="390" r="11" fill="none" stroke="#64748B" stroke-width="2" />

    <!-- Main Metallic Canister Body -->
    <rect x="175" y="150" width="150" height="220" rx="20" fill="url(#silverCan)" stroke="#94A3B8" stroke-width="2" />

    <!-- Rolled Rim Seams -->
    <ellipse cx="250" cy="160" rx="76" ry="12" fill="url(#silverCan)" stroke="#64748B" stroke-width="3" />
    <ellipse cx="250" cy="360" rx="76" ry="12" fill="url(#silverCan)" stroke="#64748B" stroke-width="3" />

    <!-- Top Inflow Nipple with Barb -->
    <rect x="242" y="80" width="16" height="75" rx="4" fill="url(#silverCan)" stroke="#64748B" stroke-width="2" />
    <circle cx="250" cy="110" r="11" fill="none" stroke="#64748B" stroke-width="2" />
    <ellipse cx="250" cy="80" rx="8" ry="4" fill="#334155" />

    <!-- Flow Direction Arrow & Technical Label -->
    <rect x="195" y="225" width="110" height="70" rx="6" fill="#FFFFFF" opacity="0.85" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 235 250 L 265 250 M 255 240 L 265 250 L 255 260" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="210" y="270" width="80" height="6" rx="2" fill="#0F172A" />
    <rect x="220" y="280" width="60" height="4" rx="1" fill="#64748B" />

    <!-- Vertical Specular Light Reflection -->
    <rect x="215" y="165" width="12" height="190" rx="6" fill="rgba(255,255,255,0.7)" />
  </g>
</svg>