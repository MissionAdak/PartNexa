<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow17" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="studioShadow17" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="coolantBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow17)" />
  <ellipse cx="250" cy="430" rx="120" ry="16" fill="#0F172A" opacity="0.14" filter="blur(10px)" />

  <g filter="url(#studioShadow17)">
    <!-- 1L Bottle Shape -->
    <path d="M 170 390 C 160 390 155 380 155 360 L 155 190 C 155 170 180 150 220 140 L 220 100 L 280 100 L 280 140 C 320 150 345 170 345 190 L 345 360 C 345 380 340 390 330 390 Z" fill="url(#coolantBody)" stroke="#0369A1" stroke-width="3" />

    <!-- Bottle Neck & Cap (Bright Green Accent) -->
    <rect x="225" y="80" width="50" height="24" rx="4" fill="#10B981" stroke="#059669" stroke-width="2" />
    <line x1="225" y1="86" x2="275" y2="86" stroke="#047857" stroke-width="1.5" /><line x1="225" y1="92" x2="275" y2="92" stroke="#047857" stroke-width="1.5" /><line x1="225" y1="98" x2="275" y2="98" stroke="#047857" stroke-width="1.5" />

    <!-- Transparent Level Window Stripe -->
    <rect x="165" y="190" width="14" height="180" rx="7" fill="#E0F2FE" opacity="0.9" stroke="#0284C7" stroke-width="1" />
    <!-- Fluorescent Green Coolant Fluid visible inside stripe -->
    <rect x="168" y="240" width="8" height="125" rx="4" fill="#22C55E" />

    <!-- Product Label -->
    <rect x="195" y="200" width="135" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="210" y="215" width="105" height="20" rx="4" fill="#10B981" />
    <rect x="210" y="245" width="90" height="12" rx="2" fill="#0F172A" />
    <rect x="210" y="265" width="105" height="8" rx="2" fill="#64748B" />
    <!-- Coolant Temperature Badge -->
    <circle cx="260" cy="315" r="24" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
    <path d="M 260 300 L 260 325 M 255 315 L 265 315" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>