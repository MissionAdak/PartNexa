<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow20" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="studioShadow20" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow20)" />
  <ellipse cx="250" cy="425" rx="160" ry="18" fill="#0F172A" opacity="0.14" filter="blur(10px)" />

  <g filter="url(#studioShadow20)">
    <!-- Horn 1: High Tone Snail Horn (Left) -->
    <g transform="translate(140, 230)">
      <circle cx="0" cy="0" r="85" fill="#1E293B" stroke="#0F172A" stroke-width="4" />
      <!-- Chrome Grille Trim -->
      <circle cx="0" cy="0" r="72" fill="none" stroke="#E2E8F0" stroke-width="5" />
      <circle cx="0" cy="0" r="50" fill="#0F172A" stroke="#94A3B8" stroke-width="3" />
      <circle cx="0" cy="0" r="20" fill="#E2E8F0" />
      <!-- Trumpet Flute -->
      <path d="M 45 45 C 80 80, 110 50, 95 10 Z" fill="#0F172A" stroke="#334155" stroke-width="3" />
      <!-- Mounting Bracket -->
      <rect x="-8" y="-120" width="16" height="45" rx="4" fill="#94A3B8" stroke="#475569" stroke-width="2" />
      <circle cx="0" cy="-105" r="5" fill="#0F172A" />
    </g>

    <!-- Horn 2: Low Tone Snail Horn (Right) -->
    <g transform="translate(320, 250)">
      <circle cx="0" cy="0" r="85" fill="#1E293B" stroke="#0F172A" stroke-width="4" />
      <circle cx="0" cy="0" r="72" fill="none" stroke="#E2E8F0" stroke-width="5" />
      <circle cx="0" cy="0" r="50" fill="#0F172A" stroke="#94A3B8" stroke-width="3" />
      <circle cx="0" cy="0" r="20" fill="#E2E8F0" />
      <path d="M -45 45 C -80 80, -110 50, -95 10 Z" fill="#0F172A" stroke="#334155" stroke-width="3" />
      <rect x="-8" y="-120" width="16" height="45" rx="4" fill="#94A3B8" stroke="#475569" stroke-width="2" />
      <circle cx="0" cy="-105" r="5" fill="#0F172A" />
    </g>
  </g>
</svg>