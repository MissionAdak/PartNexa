<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="studioShadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow8)" />
  <ellipse cx="250" cy="420" rx="160" ry="16" fill="#0F172A" opacity="0.12" filter="blur(10px)" />

  <g filter="url(#studioShadow8)">
    <!-- Longer 24" Wiper Blade -->
    <path d="M 60 170 Q 250 140 440 210" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round" />
    <!-- Aerodynamic Spoiler Ridge -->
    <path d="M 65 166 Q 250 136 435 206" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <!-- Rubber Squeegee Edge -->
    <path d="M 62 176 Q 250 146 438 216" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <!-- Central J-Hook Adapter Clip -->
    <rect x="235" y="140" width="30" height="20" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <circle cx="250" cy="150" r="4" fill="#38BDF8" />

    <!-- Shorter 16" Passenger Wiper Blade -->
    <path d="M 90 290 Q 250 260 410 320" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round" />
    <path d="M 95 286 Q 250 256 405 316" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <path d="M 92 296 Q 250 266 408 326" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <!-- Central Clip -->
    <rect x="235" y="260" width="30" height="20" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <circle cx="250" cy="270" r="4" fill="#38BDF8" />
  </g>
</svg>