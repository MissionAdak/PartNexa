<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="studioShadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="bikeBatGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bikeBatBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="80%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow5)" />
  <ellipse cx="250" cy="425" rx="140" ry="18" fill="#0F172A" opacity="0.15" filter="blur(10px)" />

  <g filter="url(#studioShadow5)">
    <!-- Compact Battery Body -->
    <rect x="110" y="160" width="280" height="240" rx="14" fill="url(#bikeBatBody)" stroke="#334155" stroke-width="3" />

    <!-- Top Cap (Amaron / Pro Green Lid) -->
    <path d="M 105 160 L 105 135 Q 105 125 120 125 L 380 125 Q 395 125 395 135 L 395 160 Z" fill="url(#bikeBatGreen)" stroke="#065F46" stroke-width="3" />

    <!-- Terminals: Flush Screw Lugs -->
    <!-- Positive -->
    <rect x="125" y="105" width="24" height="20" rx="4" fill="#E2E8F0" stroke="#64748B" stroke-width="2" />
    <circle cx="137" cy="115" r="5" fill="#EF4444" />
    <!-- Negative -->
    <rect x="351" y="105" width="24" height="20" rx="4" fill="#E2E8F0" stroke="#64748B" stroke-width="2" />
    <circle cx="363" cy="115" r="5" fill="#0F172A" />

    <!-- Front Label -->
    <rect x="135" y="200" width="230" height="160" rx="8" fill="#022C22" stroke="#10B981" stroke-width="2" />
    <rect x="155" y="225" width="110" height="22" rx="4" fill="#10B981" />
    <rect x="155" y="260" width="190" height="12" rx="3" fill="#FFFFFF" />
    <rect x="155" y="282" width="150" height="10" rx="2" fill="#6EE7B7" />
    <rect x="155" y="305" width="80" height="24" rx="4" fill="#047857" />

    <!-- 12V 4Ah Motorcycle spec badge -->
    <circle cx="320" cy="317" r="18" fill="#F59E0B" />
  </g>
</svg>