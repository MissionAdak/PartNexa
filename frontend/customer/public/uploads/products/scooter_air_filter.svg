      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="studioShadow24" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow24)" />
  <ellipse cx="250" cy="425" rx="150" ry="18" fill="#0F172A" opacity="0.14" filter="blur(10px)" />

