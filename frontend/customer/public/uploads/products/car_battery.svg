<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="studioShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="batteryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="batteryBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="30%" stop-color="#334155" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="leadTerminal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow4)" />
  <ellipse cx="250" cy="430" rx="180" ry="22" fill="#0F172A" opacity="0.16" filter="blur(12px)" />

  <g filter="url(#studioShadow4)">
    <!-- Battery Main Body -->
    <rect x="80" y="160" width="340" height="250" rx="12" fill="url(#batteryBody)" stroke="#475569" stroke-width="3" />

    <!-- Reinforced Vertical Ribs -->
    
      <line x1="120" y1="180" x2="120" y2="390" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-linecap="round" />
    
      <line x1="160" y1="180" x2="160" y2="390" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-linecap="round" />
    
      <line x1="200" y1="180" x2="200" y2="390" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-linecap="round" />
    
      <line x1="240" y1="180" x2="240" y2="390" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-linecap="round" />
    
      <line x1="280" y1="180" x2="280" y2="390" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-linecap="round" />
    
      <line x1="320" y1="180" x2="320" y2="390" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-linecap="round" />
    
      <line x1="360" y1="180" x2="360" y2="390" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-linecap="round" />
    

    <!-- Battery Top Cover (Red Lid) -->
    <path d="M 75 160 L 75 135 Q 75 125 90 125 L 410 125 Q 425 125 425 135 L 425 160 Z" fill="url(#batteryRed)" stroke="#B91C1C" stroke-width="3" />
    <rect x="90" y="130" width="320" height="6" fill="rgba(255,255,255,0.3)" rx="3" />

    <!-- Terminals: POSITIVE (+) on Left, NEGATIVE (-) on Right -->
    <!-- Positive Terminal (Red Ring) -->
    <circle cx="120" cy="110" r="18" fill="url(#leadTerminal)" stroke="#64748B" stroke-width="2" />
    <circle cx="120" cy="110" r="12" fill="#DC2626" />
    <rect x="114" y="108" width="12" height="4" fill="#FFFFFF" rx="1" />
    <rect x="118" y="104" width="4" height="12" fill="#FFFFFF" rx="1" />

    <!-- Negative Terminal (Black/Blue Ring) -->
    <circle cx="380" cy="110" r="16" fill="url(#leadTerminal)" stroke="#64748B" stroke-width="2" />
    <circle cx="380" cy="110" r="11" fill="#1E293B" />
    <rect x="374" y="108" width="12" height="4" fill="#FFFFFF" rx="1" />

    <!-- Battery Carry Handle (Folded Down) -->
    <path d="M 100 135 C 100 80, 400 80, 400 135" fill="none" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Front Technical Brand Label -->
    <rect x="110" y="210" width="280" height="150" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
    <rect x="130" y="235" width="120" height="24" rx="4" fill="#F59E0B" />
    <rect x="130" y="275" width="240" height="12" rx="3" fill="#FFFFFF" />
    <rect x="130" y="295" width="180" height="10" rx="2" fill="#94A3B8" />

    <!-- 12V 45Ah Bold Spec Tag -->
    <rect x="130" y="320" width="70" height="22" rx="4" fill="#0284C7" />
    <circle cx="345" cy="245" r="16" fill="#10B981" />
  </g>
</svg>