<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow10" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="studioShadow10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="chromeRod" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="strutYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="80%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow10)" />
  <ellipse cx="250" cy="435" rx="90" ry="14" fill="#0F172A" opacity="0.14" filter="blur(10px)" />

  <g filter="url(#studioShadow10)" transform="translate(0, 0)">
    <!-- Top Eyelet Mount -->
    <circle cx="250" cy="70" r="22" fill="#1E293B" stroke="#475569" stroke-width="4" />
    <circle cx="250" cy="70" r="10" fill="#E2E8F0" />

    <!-- Polished Chrome Piston Rod -->
    <rect x="242" y="88" width="16" height="150" fill="url(#chromeRod)" stroke="#64748B" stroke-width="1.5" />

    <!-- Bump Stop Rubber Bushing -->
    <rect x="236" y="145" width="28" height="24" rx="6" fill="#F97316" stroke="#C2410C" stroke-width="2" />

    <!-- Upper Spring Perch Plate -->
    <ellipse cx="250" cy="180" rx="60" ry="12" fill="#1E293B" stroke="#475569" stroke-width="3" />

    <!-- Lower Main Damper Tube -->
    <rect x="230" y="240" width="40" height="150" rx="8" fill="url(#strutYellow)" stroke="#B45309" stroke-width="3" />

    <!-- Heavy-Duty Steel Coil Spring (Coiled Around Rod) -->
    
      <path d="M 200 195 Q 250 177 300 195" fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round" />
      <path d="M 200 195 Q 250 177 300 195" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" />
    
      <path d="M 200 230 Q 250 212 300 230" fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round" />
      <path d="M 200 230 Q 250 212 300 230" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" />
    
      <path d="M 200 265 Q 250 247 300 265" fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round" />
      <path d="M 200 265 Q 250 247 300 265" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" />
    
      <path d="M 200 300 Q 250 282 300 300" fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round" />
      <path d="M 200 300 Q 250 282 300 300" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" />
    
      <path d="M 200 335 Q 250 317 300 335" fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round" />
      <path d="M 200 335 Q 250 317 300 335" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" />
    

    <!-- Lower Spring Perch Plate -->
    <ellipse cx="250" cy="355" rx="60" ry="12" fill="#1E293B" stroke="#475569" stroke-width="3" />

    <!-- Bottom Eyelet Bushing Mount -->
    <circle cx="250" cy="410" r="24" fill="#1E293B" stroke="#475569" stroke-width="4" />
    <circle cx="250" cy="410" r="12" fill="#E2E8F0" />
  </g>
</svg>