<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow21" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="studioShadow21" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow21)" />
  <ellipse cx="250" cy="430" rx="90" ry="14" fill="#0F172A" opacity="0.14" filter="blur(10px)" />

  <g filter="url(#studioShadow21)">
    <!-- Top Head with 3-Pin Socket & Bolt Flange -->
    <path d="M 190 120 L 310 120 Q 320 120 320 135 L 305 170 L 195 170 Q 180 170 180 135 Z" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <!-- Mounting Eyelet -->
    <circle cx="170" cy="145" r="14" fill="#475569" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="170" cy="145" r="6" fill="#0F172A" />
    <!-- 3-Pin Connector Socket -->
    <rect x="235" y="90" width="30" height="32" rx="4" fill="#1E293B" stroke="#0284C7" stroke-width="2" />

    <!-- Upper Ferrite Core Column -->
    <rect x="236" y="170" width="28" height="110" fill="#334155" stroke="#475569" stroke-width="2" />

    <!-- Rubber Boot (Spark Plug Connector Sleeve) -->
    <rect x="232" y="280" width="36" height="110" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="3" />
    <line x1="232" y1="295" x2="268" y2="295" stroke="#475569" stroke-width="2" /><line x1="232" y1="315" x2="268" y2="315" stroke="#475569" stroke-width="2" /><line x1="232" y1="335" x2="268" y2="335" stroke="#475569" stroke-width="2" /><line x1="232" y1="355" x2="268" y2="355" stroke="#475569" stroke-width="2" />

    <!-- Lower Silicone Tip Seal -->
    <path d="M 236 390 L 264 390 L 255 415 L 245 415 Z" fill="#DC2626" stroke="#991B1B" stroke-width="2" />
  </g>
</svg>