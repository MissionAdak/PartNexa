<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow12" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="studioShadow12" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="starterBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="castAluminum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow12)" />
  <ellipse cx="250" cy="425" rx="160" ry="18" fill="#0F172A" opacity="0.15" filter="blur(10px)" />

  <g filter="url(#studioShadow12)">
    <!-- Main Motor Armature Cylinder -->
    <rect x="180" y="210" width="220" height="110" rx="18" fill="url(#starterBody)" stroke="#334155" stroke-width="3" />

    <!-- Rear Commutator Cap -->
    <path d="M 400 220 C 420 220, 425 310, 400 310 Z" fill="url(#castAluminum)" stroke="#64748B" stroke-width="2" />

    <!-- Solenoid Switch (Piggybacked Above) -->
    <rect x="230" y="130" width="140" height="70" rx="14" fill="#0F172A" stroke="#475569" stroke-width="3" />
    <rect x="220" y="140" width="16" height="50" rx="4" fill="url(#castAluminum)" />
    <!-- Solenoid Copper Terminals -->
    <circle cx="380" cy="155" r="8" fill="#B45309" stroke="#F59E0B" stroke-width="2" />
    <circle cx="380" cy="175" r="8" fill="#B45309" stroke="#F59E0B" stroke-width="2" />

    <!-- Front Nose Cone / Drive Housing (Cast Aluminum) -->
    <path d="M 180 200 L 120 230 L 120 290 L 180 320 Z" fill="url(#castAluminum)" stroke="#475569" stroke-width="3" />
    <!-- Mounting Ears with Bolt Holes -->
    <circle cx="165" cy="185" r="14" fill="url(#castAluminum)" stroke="#475569" stroke-width="2" />
    <circle cx="165" cy="185" r="6" fill="#0F172A" />
    <circle cx="165" cy="335" r="14" fill="url(#castAluminum)" stroke="#475569" stroke-width="2" />
    <circle cx="165" cy="335" r="6" fill="#0F172A" />

    <!-- Bendix Pinion Gear -->
    <rect x="85" y="245" width="35" height="30" rx="4" fill="#334155" stroke="#94A3B8" stroke-width="2" />
    
      <rect x="85" y="248" width="14" height="4" fill="#E2E8F0" />
    
      <rect x="85" y="255" width="14" height="4" fill="#E2E8F0" />
    
      <rect x="85" y="262" width="14" height="4" fill="#E2E8F0" />
    
      <rect x="85" y="269" width="14" height="4" fill="#E2E8F0" />
    

    <!-- Specular Highlight Strip -->
    <rect x="200" y="225" width="180" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
  </g>
</svg>