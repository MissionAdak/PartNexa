<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <filter id="studioShadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#CCFBF1" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#E0F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="chromeBowl" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="80%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow6)" />
  <ellipse cx="250" cy="425" rx="160" ry="20" fill="#0F172A" opacity="0.14" filter="blur(12px)" />

  <g filter="url(#studioShadow6)">
    <!-- Aerodynamic Headlamp Housing (Black Backing) -->
    <path d="M 70 240 Q 90 140 230 130 L 420 180 Q 440 240 410 320 Q 300 370 120 340 Q 60 300 70 240 Z" fill="#1E293B" stroke="#0F172A" stroke-width="4" />

    <!-- Chrome Internal Reflector Bowl -->
    <ellipse cx="220" cy="245" rx="85" ry="75" fill="url(#chromeBowl)" stroke="#CBD5E1" stroke-width="3" />

    <!-- Projector Lens & LED Halo Ring -->
    <circle cx="220" cy="245" r="48" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
    <circle cx="220" cy="245" r="38" fill="url(#lensGlass)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="220" cy="245" r="18" fill="#E0F2FE" opacity="0.85" />
    <circle cx="212" cy="237" r="6" fill="#FFFFFF" />

    <!-- High-Beam Auxiliary Section -->
    <ellipse cx="340" cy="235" rx="45" ry="40" fill="url(#chromeBowl)" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="340" cy="235" r="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />

    <!-- LED DRL Light-Guide Ribbon -->
    <path d="M 120 175 Q 220 155 400 195" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <path d="M 120 175 Q 220 155 400 195" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

    <!-- Outer Clear Polycarbonate Lens with Glass Sheen -->
    <path d="M 70 240 Q 90 140 230 130 L 420 180 Q 440 240 410 320 Q 300 370 120 340 Q 60 300 70 240 Z" fill="url(#lensGlass)" opacity="0.35" stroke="rgba(255,255,255,0.7)" stroke-width="2" />

    <!-- Specular Highlight Lines across lens -->
    <path d="M 100 230 Q 180 170 360 190" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>